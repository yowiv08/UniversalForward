name: Release UniversalForward

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/UniversalForward.Tests/UniversalForward.Tests.csproj -c Release --nologo
      - name: Build plugin
        run: pwsh -File ./buildall.ps1 -OutputDirectory ./artifacts/plugins
      - name: Test isolated plugin
        env:
          UNIVERSALFORWARD_TEST_PACKAGE: ${{ github.workspace }}/artifacts/plugins/universalforward
        run: dotnet test tests/UniversalForward.Tests/UniversalForward.Tests.csproj -c Release --no-build --nologo --filter FullyQualifiedName~RequestJournalIsolationTests
      - name: Create archive and index
        shell: pwsh
        run: ./package-release.ps1 -Tag $env:RELEASE_TAG
      - name: Validate release package
        shell: pwsh
        run: ./tests/release-packaging.ps1 -Tag $env:RELEASE_TAG
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/release/universalforward.zip \
            artifacts/release/release-index.json \
            --verify-tag --title "UniversalForward $RELEASE_TAG" \
            --notes-file artifacts/release/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --draft=false
